<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHINI SPINNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee+Outline&family=Bungee+Shade&family=Bungee&family=Permanent+Marker&family=Syne:wght@800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Great+Vibes&family=Cinzel:wght@600;700;800;900&display=swap');
        
        :root {
          --neon-pink: #ff00ff;
          --neon-cyan: #00ffff;
          --neon-yellow: #ffff00;
          --punk-red: #ff3e3e;
          --val-red: #dc2626;
          --val-gold: #fbbf24;
        }

        body {
            font-family: 'Syne', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.05) 0%, transparent 40%);
        }

        .font-bungee { font-family: 'Bungee', cursive; }
        .font-marker { font-family: 'Permanent Marker', cursive; }
        .font-syne { font-family: 'Syne', sans-serif; }

        /* Jarring Screen Shake */
        @keyframes jarring-shake {
          0%, 100% { transform: translate(0, 0) rotate(0deg); }
          10% { transform: translate(-10px, -10px) rotate(-2deg); }
          20% { transform: translate(10px, 5px) rotate(2deg); }
          30% { transform: translate(-5px, 10px) rotate(-1deg); }
          40% { transform: translate(5px, -10px) rotate(1deg); }
          50% { transform: translate(-10px, 5px) rotate(-2deg); }
          60% { transform: translate(10px, -5px) rotate(2deg); }
          70% { transform: translate(-5px, -10px) rotate(-1deg); }
          80% { transform: translate(5px, 10px) rotate(1deg); }
          90% { transform: translate(-10px, -5px) rotate(-2deg); }
        }

        .animate-jarring-shake {
          animation: jarring-shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Portrait Wobble Glitch */
        @keyframes portrait-wobble-glitch {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            30% { transform: translate(1px, -1px) rotate(0.5deg); }
            45% { transform: translate(-1px, -1px) rotate(-0.2deg); }
            60% { transform: translate(1px, 1px) rotate(0.2deg); }
            85% { transform: translate(2px, 0) rotate(1deg); filter: brightness(1.2) contrast(1.1); }
            87% { transform: translate(-2px, 0) rotate(-1deg); filter: brightness(0.8) contrast(1.2); }
        }

        .animate-portrait-funky {
            animation: portrait-wobble-glitch 4s infinite linear;
        }

        /* Particle Burst Animation */
        @keyframes particle-burst {
          0% { transform: translate(0, 0) scale(1); opacity: 1; }
          100% { transform: translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0); opacity: 0; }
        }

        .animate-particle {
          animation: particle-burst 0.8s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
        }

        /* Classy Glitch */
        .glitch {
            position: relative;
            text-shadow: 0.05em 0 0 rgba(255, 0, 255, 0.75),
                        -0.025em -0.05em 0 rgba(0, 255, 255, 0.75),
                        0.025em 0.05em 0 rgba(255, 255, 0, 0.75);
            animation: glitch 500ms infinite;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255, 0, 255, 0.75), -0.05em -0.025em 0 rgba(0, 255, 255, 0.75), -0.025em 0.05em 0 rgba(255, 255, 0, 0.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255, 0, 255, 0.75), -0.05em -0.025em 0 rgba(0, 255, 255, 0.75), -0.025em 0.05em 0 rgba(255, 255, 0, 0.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 255, 0.75), 0.025em 0.025em 0 rgba(0, 255, 255, 0.75), -0.05em -0.05em 0 rgba(255, 255, 0, 0.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 255, 0.75), 0.025em 0.025em 0 rgba(0, 255, 255, 0.75), -0.05em -0.05em 0 rgba(255, 255, 0, 0.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 255, 0.75), 0.05em 0 0 rgba(0, 255, 255, 0.75), 0 -0.05em 0 rgba(255, 255, 0, 0.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 255, 0.75), 0.05em 0 0 rgba(0, 255, 255, 0.75), 0 -0.05em 0 rgba(255, 255, 0, 0.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255, 0, 255, 0.75), -0.025em -0.025em 0 rgba(0, 255, 255, 0.75), -0.025em -0.05em 0 rgba(255, 255, 0, 0.75); }
        }

        /* Punk Scanlines */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
        }

        .punk-border {
            border: 4px solid white;
            box-shadow: 8px 8px 0px var(--neon-pink);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .punk-border:hover { transform: translate(-2px, -2px); }

        .punk-border-cyan {
            border: 4px solid white;
            box-shadow: 8px 8px 0px var(--neon-cyan);
        }

        /* Floating Background Grid */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(0);
            animation: grid-scroll 20s linear infinite;
            z-index: -1;
            opacity: 0.3;
        }
        @keyframes grid-scroll {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        /* Sector Hover Animation */
        @keyframes punk-sector-pulse {
            0% { filter: brightness(1) drop-shadow(0 0 0px var(--neon-pink)); }
            50% { filter: brightness(1.4) drop-shadow(0 0 20px var(--neon-cyan)); }
            100% { filter: brightness(1) drop-shadow(0 0 0px var(--neon-pink)); }
        }

        .punk-sector {
            transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 50px 50px;
        }
        
        .punk-sector:hover {
            animation: punk-sector-pulse 0.8s infinite ease-in-out;
            cursor: pointer;
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        /* Funky Spin Animations */
        @keyframes wheel-wobble {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, -2px) rotate(0.2deg); }
            50% { transform: translate(-2px, 2px) rotate(-0.2deg); }
            75% { transform: translate(2px, 2px) rotate(0.1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes wheel-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); filter: brightness(1.1); }
            100% { transform: scale(1); }
        }

        .animate-wheel-funky {
            animation: wheel-wobble 0.15s infinite linear, wheel-pulse 0.6s infinite ease-in-out;
        }

        .spin-blur {
            filter: blur(1.5px) contrast(1.2);
            transition: filter 0.5s ease-out;
        }

        /* Confetti Animation */
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 8px;
            top: 0;
            opacity: 0;
            animation: fall 3.5s infinite linear;
        }
        @keyframes fall {
            0% { top: -10%; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 110%; opacity: 0; transform: translateX(150px) rotate(720deg); }
        }

        .btn-punk {
            position: relative;
            background: white;
            color: black;
            font-weight: 900;
            padding: 1rem 2rem;
            transform: skew(-10deg);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid black;
        }
        .btn-punk:hover {
            transform: skew(-10deg) translate(-4px, -4px);
            box-shadow: 12px 12px 0px var(--neon-cyan);
            background: var(--neon-pink);
            color: white;
        }

        .wheel-text {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 2.5px;
            font-weight: 400;
            fill: white;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Polished Level Up */
        .level-card {
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid white;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
        }

        /* Countdown Pop Animation */
        @keyframes countdown-pop {
            0% { transform: scale(0.4) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
            75% { transform: scale(0.95); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-countdown-pop {
            animation: countdown-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        /* Valentine Seductive Font Styles */
        .font-romance { font-family: 'Great Vibes', cursive; }
        .font-serif-elegant { font-family: 'Playfair Display', serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }

        /* Valentine Seductive Heart Beats */
        @keyframes heart-beat {
          0%, 100% { transform: scale(1); }
          25% { transform: scale(1.08); }
          40% { transform: scale(1.03); }
          60% { transform: scale(1.12); }
        }
        .animate-heart-beat {
          animation: heart-beat 1.4s infinite ease-in-out;
        }

        /* Ambient Floating Hearts background */
        @keyframes float-heart {
          0% { transform: translateY(110vh) translateX(0) scale(0.5) rotate(0deg); opacity: 0; }
          10% { opacity: 0.7; }
          90% { opacity: 0.7; }
          100% { transform: translateY(-20vh) translateX(var(--twist, 80px)) scale(1.2) rotate(var(--angle, 45deg)); opacity: 0; }
        }
        .floating-heart-obj {
          position: fixed;
          pointer-events: none;
          z-index: 0;
          color: rgba(220, 38, 38, 0.25);
          animation: float-heart var(--duration, 8s) ease-in-out infinite;
        }

        /* Romantic Seductive Button */
        .btn-valentine {
          position: relative;
          background: linear-gradient(135deg, #ef4444, #7f1d1d);
          color: #fef08a; /* Warm yellow/gold text */
          font-weight: 800;
          letter-spacing: 0.05em;
          padding: 1rem 2rem;
          border-radius: 9999px; /* Pill shape for romantic elegance */
          box-shadow: 0 0 15px rgba(220, 38, 38, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
          border: 2px solid #f59e0b;
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
          transform: skew(0deg);
        }
        .btn-valentine:hover {
          transform: translateY(-2px) scale(1.03) skew(0deg);
          box-shadow: 0 0 25px rgba(244, 63, 94, 0.75), inset 0 2px 4px rgba(255, 255, 255, 0.4);
          background: linear-gradient(135deg, #f43f5e, #be123c);
          color: white;
          border-color: #fcd34d;
        }

        /* Valentine Seductive Sector Pulsing */
        @keyframes romantic-sector-pulse {
            0% { filter: brightness(1) drop-shadow(0 0 0px #ef4444); }
            50% { filter: brightness(1.3) drop-shadow(0 0 15px #fcd34d); }
            100% { filter: brightness(1) drop-shadow(0 0 0px #ef4444); }
        }
        .romantic-sector {
            transition: filter 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 50px 50px;
        }
        .romantic-sector:hover {
            animation: romantic-sector-pulse 0.8s infinite ease-in-out;
            cursor: pointer;
            transform: scale(1.02);
            filter: brightness(1.15);
        }
    </style>
